<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lista Spesa Smart</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

    h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--accent); }
    
    .card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn {
      background: var(--accent); color: #000; font-weight: 600; padding: 12px 16px;
      border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; font-size: 0.95rem; transition: background 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-danger { background: transparent; color: var(--danger); padding: 6px; }

    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: var(--text); font-size: 0.95rem; margin-top: 6px;
    }
    input[type="file"] { display: none; }

    .add-manual { display: flex; gap: 8px; margin-top: 10px; }
    .add-manual input { margin-top: 0; flex: 1; }

    ul { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    li {
      background: #0f172a; padding: 12px 14px; border-radius: 8px; display: flex;
      align-items: center; justify-content: space-between; border: 1px solid #334155;
    }
    li.checked { opacity: 0.5; text-decoration: line-through; }
    
    .checkbox-container { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; }
    .checkbox-container input { width: 18px; height: 18px; accent-color: var(--accent); }

    .spinner {
      display: none; text-align: center; padding: 12px; font-size: 0.9rem; color: var(--accent);
    }
    
    .badge { font-size: 0.8rem; background: #334155; padding: 2px 8px; border-radius: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛒 Lista Spesa Smart</h1>

  <!-- Impostazione API Key -->
  <details class="card">
    <summary style="cursor:pointer; color:var(--text-muted); font-size:0.9rem;">Configura API Key Gemini</summary>
    <input type="password" id="apiKey" placeholder="Incolla la tua Gemini API Key..." onchange="saveKey()">
  </details>

  <!-- Pulsanti Scatto / Galleria -->
  <div class="card actions">
    <button class="btn" onclick="document.getElementById('cameraInput').click()">📸 Scatta Foto</button>
    <button class="btn btn-secondary" onclick="document.getElementById('galleryInput').click()">🖼️ Galleria</button>
    
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">
    <input type="file" id="galleryInput" accept="image/*" onchange="processImage(this)">
  </div>

  <div id="loading" class="spinner">⚡ Analisi immagine in corso con l'IA...</div>

  <!-- Aggiunta Manuale -->
  <div class="card">
    <div class="add-manual">
      <input type="text" id="manualInput" placeholder="Aggiungi prodotto a mano..." onkeypress="if(event.key==='Enter') addManualItem()">
      <button class="btn" onclick="addManualItem()">+</button>
    </div>
  </div>

  <!-- Lista Articoli -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3>Da Comprare <span id="count" class="badge">0</span></h3>
      <button class="btn-danger" style="font-size:0.8rem;" onclick="clearAll()">Svuota lista</button>
    </div>
    <ul id="shoppingList"></ul>
  </div>
</div>

<script>
  let items = JSON.parse(localStorage.getItem('spesa_items') || '[]');
  
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('apiKey').value = localStorage.getItem('gemini_key') || '';
    renderList();
  });

  function saveKey() {
    localStorage.setItem('gemini_key', document.getElementById('apiKey').value.trim());
  }

  function renderList() {
    const listEl = document.getElementById('shoppingList');
    listEl.innerHTML = '';
    let remaining = 0;

    items.forEach((item, index) => {
      if (!item.checked) remaining++;
      const li = document.createElement('li');
      if (item.checked) li.classList.add('checked');

      li.innerHTML = `
        <label class="checkbox-container">
          <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${index})">
          <span>${escapeHtml(item.text)}</span>
        </label>
        <button class="btn-danger" onclick="deleteItem(${index})">✕</button>
      `;
      listEl.appendChild(li);
    });

    document.getElementById('count').textContent = remaining;
    localStorage.setItem('spesa_items', JSON.stringify(items));
  }

  function toggleItem(index) {
    items[index].checked = !items[index].checked;
    renderList();
  }

  function deleteItem(index) {
    items.splice(index, 1);
    renderList();
  }

  function clearAll() {
    if (confirm('Vuoi cancellare tutti gli elementi?')) {
      items = [];
      renderList();
    }
  }

  function addManualItem() {
    const input = document.getElementById('manualInput');
    const text = input.value.trim();
    if (text) {
      items.push({ text: text, checked: false });
      input.value = '';
      renderList();
    }
  }

  async function processImage(input) {
    const key = localStorage.getItem('gemini_key');
    if (!key) {
      alert('Inserisci prima la tua Gemini API Key nella sezione configurazione.');
      return;
    }
    
    const file = input.files[0];
    if (!file) return;

    document.getElementById('loading').style.display = 'block';

    try {
      const base64 = await fileToBase64(file);
      const base64Data = base64.split(',')[1];

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "Estrrai un elenco sintetico dei prodotti da comprare o identificabili nell'immagine. Restituisci ESCLUSIVAMENTE un array JSON valido di stringhe, senza markdown, es: [\"Latte\", \"Pane\", \"Uova\"]" },
              { inline_data: { mime_type: file.type, data: base64Data } }
            ]
          }]
        })
      });

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const detectedItems = JSON.parse(rawText);

      if (Array.isArray(detectedItems)) {
        detectedItems.forEach(prod => {
          if (prod && !items.some(i => i.text.toLowerCase() === prod.toLowerCase())) {
            items.push({ text: prod, checked: false });
          }
        });
        renderList();
      }
    } catch (err) {
      alert('Errore durante l\'analisi dell\'immagine. Controlla la Key o riprova.');
      console.error(err);
    } finally {
      document.getElementById('loading').style.display = 'none';
      input.value = '';
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }
</script>
</body>
</html>
